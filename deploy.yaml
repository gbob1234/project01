stages:
  - build

variables:
  # Docker-in-Docker
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

  # Harbor
  FRONTEND_IMAGE: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/frontend"
  BACKEND_IMAGE: "${HARBOR_REGISTRY}/${HARBOR_PROJECT}/backend"

default:
  image:
    name: "${HARBOR_REGISTRY}/cicd/docker:27-cli"

  services:
    - name: "${HARBOR_REGISTRY}/cicd/docker:27-dind"
      alias: docker

  before_script:
    - docker info
    - echo "${HARBOR_PASSWORD}" | docker login "${HARBOR_REGISTRY}" -u "${HARBOR_USER}" --password-stdin


# ------------------------------------------------------------
# Frontend
# frontend/Dockerfile
#
# Node 20 -> npm build
# nginx 1.27-alpine -> runtime image
# ------------------------------------------------------------
build_frontend:
  stage: build

  script:
    - echo "===== Frontend image build start ====="

    - >
      docker build
      --pull
      -t "${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      -t "${FRONTEND_IMAGE}:latest"
      ./frontend

    - docker push "${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${FRONTEND_IMAGE}:latest"

  rules:
    - changes:
        - frontend/**/*
        - .gitlab-ci.yml


# ------------------------------------------------------------
# Backend
# backend/Dockerfile
#
# Python 3.12-slim
# Django
# Gunicorn 22
# ------------------------------------------------------------
build_backend:
  stage: build

  script:
    - echo "===== Backend image build start ====="

    - >
      docker build
      --pull
      -t "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      -t "${BACKEND_IMAGE}:latest"
      ./backend

    - docker push "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - docker push "${BACKEND_IMAGE}:latest"

  rules:
    - changes:
        - backend/**/*
        - .gitlab-ci.yml
