# ============================================================
# Secret
# 실제 운영에서는 GitLab CI/CD Variable, External Secret,
# Sealed Secret 등을 사용하는 것을 권장합니다.
# stringData는 예제용입니다.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: webapp-secret
type: Opaque
stringData:
  PG_DB: "mydb"
  PG_USER: "myuser"
  PG_PASSWORD: "change-me"


---
# ============================================================
# ConfigMap
# 비밀번호가 아닌 일반 환경변수
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: webapp-config
data:
  DJANGO_SETTINGS_MODULE: "config.settings.prod"

  # 같은 Pod 내 PostgreSQL이므로 localhost 사용
  PG_HOST: "127.0.0.1"
  PG_PORT: "5432"

  # frontend -> backend도 같은 Pod
  BACKEND_ORIGIN: "http://127.0.0.1:8000"


---
# ============================================================
# StatefulSet
#
# 하나의 Pod 안에
#   - pgvector
#   - backend
#   - frontend
# 총 3개 컨테이너 실행
# ============================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: webapp
spec:
  serviceName: webapp
  replicas: 1

  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:
      containers:

        # ====================================================
        # PostgreSQL + pgvector
        # ====================================================
        - name: db
          image: harbor.example.com/library/pgvector:pg16
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: webapp-secret
                  key: PG_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: webapp-secret
                  key: PG_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webapp-secret
                  key: PG_PASSWORD

          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data

          # Docker Compose healthcheck 대응
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >
                  pg_isready
                  -U "$POSTGRES_USER"
                  -d "$POSTGRES_DB"
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >
                  pg_isready
                  -U "$POSTGRES_USER"
                  -d "$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >
                  pg_isready
                  -U "$POSTGRES_USER"
                  -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5


        # ====================================================
        # Django + Gunicorn Backend
        # ====================================================
        - name: backend
          image: harbor.example.com/myproject/backend:version
          imagePullPolicy: IfNotPresent

          ports:
            - name: backend
              containerPort: 8000
              protocol: TCP

          env:
            - name: DJANGO_SETTINGS_MODULE
              valueFrom:
                configMapKeyRef:
                  name: webapp-config
                  key: DJANGO_SETTINGS_MODULE

            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: webapp-config
                  key: PG_HOST

            - name: PG_PORT
              valueFrom:
                configMapKeyRef:
                  name: webapp-config
                  key: PG_PORT

            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: webapp-secret
                  key: PG_DB

            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: webapp-secret
                  key: PG_USER

            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webapp-secret
                  key: PG_PASSWORD

          # Django에 /health 같은 endpoint가 있다면
          # httpGet 방식으로 바꾸는 것을 권장
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5


        # ====================================================
        # Nginx Frontend
        # ====================================================
        - name: frontend
          image: harbor.example.com/myproject/frontend:version
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: BACKEND_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: webapp-config
                  key: BACKEND_ORIGIN

          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5


  # ==========================================================
  # PostgreSQL Persistent Volume
  # StatefulSet Pod 재생성 시에도 동일 PVC 유지
  # ==========================================================
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes:
          - ReadWriteOnce

        # 실제 환경의 StorageClass로 변경
        storageClassName: powerstore

        resources:
          requests:
            storage: 20Gi


---
# ============================================================
# Service
#
# 외부에서는 frontend nginx :80만 접근
#
# backend/db는 같은 Pod 내부에서 localhost로 접근하기 때문에
# 별도 Service가 필요하지 않음
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: webapp
spec:
  type: ClusterIP

  selector:
    app: webapp

  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
